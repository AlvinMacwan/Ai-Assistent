<!DOCTYPE html>
<html>
<head>
    <title>RAG Demo</title>
    <style>
        body {
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
            background: #fafafa;
        }
        h1 { font-size: 1.6em; }
        h2 { font-size: 1.1em; margin-top: 2em; color: #444; }
        .card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 16px;
        }
        input[type="text"] {
            width: 70%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #2b6cb0;
            color: white;
            cursor: pointer;
            font-size: 0.95em;
        }
        button:hover { background: #245a95; }
        .status { color: #555; font-size: 0.9em; margin-top: 8px; }
        .error { color: #c0392b; font-weight: 500; }
        .answer-box {
            background: #eef5ff;
            border-left: 4px solid #2b6cb0;
            padding: 12px 16px;
            margin-top: 12px;
            white-space: pre-wrap;
        }
        .chunk {
            background: #f5f5f5;
            border-left: 3px solid #aaa;
            padding: 8px 12px;
            margin-top: 8px;
            font-size: 0.85em;
            color: #444;
        }
        .chunk .score { color: #888; font-family: monospace; }
    </style>
</head>
<body>
    <h1>RAG Demo</h1>

    <div class="card">
        <h2>1. Upload a document</h2>
        <input type="file" id="fileInput">
        <button id="uploadBtn">Upload</button>
        <p class="status" id="uploadStatus"></p>
    </div>

    <div class="card">
        <h2>2. Ask a question</h2>
        <p>
            <label for="sourceSelect">Limit to document:</label>
            <select id="sourceSelect">
                <option value="">All documents</option>
            </select>
        </p>
        <input type="text" id="questionInput" placeholder="Ask something about the document...">
        <button id="askBtn">Ask</button>

        <div id="answerContainer"></div>
        <div id="chunksContainer"></div>
    </div>

    <script>
        const uploadStatus = document.getElementById("uploadStatus");
        const answerContainer = document.getElementById("answerContainer");
        const chunksContainer = document.getElementById("chunksContainer");
        const sourceSelect = document.getElementById("sourceSelect");

        // --- Load the list of indexed documents into the dropdown ---
        async function refreshDocumentList() {
            const response = await fetch("/documents");
            const data = await response.json();

            // Reset dropdown to just the "All documents" option
            sourceSelect.innerHTML = '<option value="">All documents</option>';

            data.documents.forEach((doc) => {
                const option = document.createElement("option");
                option.value = doc;
                option.textContent = doc;
                sourceSelect.appendChild(option);
            });
        }

        // Populate the dropdown once when the page first loads
        refreshDocumentList();

        // --- Upload button logic ---
        document.getElementById("uploadBtn").addEventListener("click", async () => {
            const fileInput = document.getElementById("fileInput");
            const file = fileInput.files[0];

            if (!file) {
                uploadStatus.innerHTML = '<span class="error">Please choose a file first.</span>';
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            uploadStatus.innerText = "Uploading and indexing...";

            const response = await fetch("/upload", {
                method: "POST",
                body: formData,
            });
            const data = await response.json();

            if (data.error) {
                uploadStatus.innerHTML = `<span class="error">${data.error}</span>`;
            } else {
                uploadStatus.innerText = data.message;
                refreshDocumentList();  // new document is indexed - refresh the filter dropdown
            }
        });

        // --- Ask button logic ---
        document.getElementById("askBtn").addEventListener("click", async () => {
            const question = document.getElementById("questionInput").value;
            const source = sourceSelect.value;  // "" means "All documents"

            if (!question) {
                answerContainer.innerHTML = '<p class="error">Please type a question first.</p>';
                return;
            }

            answerContainer.innerHTML = '<p class="status">Thinking...</p>';
            chunksContainer.innerHTML = "";

            const response = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: question, source: source }),
            });
            const data = await response.json();

            if (data.error) {
                answerContainer.innerHTML = `<p class="error">${data.error}</p>`;
                return;
            }

            answerContainer.innerHTML = `<div class="answer-box">${data.answer}</div>`;

            // Render each retrieved chunk so retrieval is visible, not a black box
            let chunksHtml = "<h2>Retrieved chunks</h2>";
            data.retrieved_chunks.forEach((c) => {
                chunksHtml += `<div class="chunk"><span class="score">${c.distance}</span> | ${c.text}</div>`;
            });
            chunksContainer.innerHTML = chunksHtml;
        });
    </script>
</body>
</html>
